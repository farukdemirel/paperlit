name: Android CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle hazırla
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle Wrapper doğrula
        uses: gradle/actions/wrapper-validation@v4

      - name: KVM erişimini hazırla
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Birim testlerini çalıştır
        run: ./gradlew testDebugUnitTest

      - name: Sanal cihazda arayüz testlerini çalıştır
        run: ./gradlew pixel2Api35DebugAndroidTest -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Debug APK üret
        run: ./gradlew assembleDebug

      - name: APK'yı artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: paperlit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Test raporlarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paperlit-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/androidTests/
          if-no-files-found: warn
